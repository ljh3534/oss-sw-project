# 8주차: Composite Action — 모든 잡에서 반복되던 "Node 설치 + 의존성 설치"를 하나로 묶는다.
# 액션 버전·npm 옵션·캐시 정책을 이 파일 한 곳에서 관리한다.
name: Setup project
description: Node.js 설치, npm/node_modules 캐시 복원, 의존성 설치

inputs:
  node-version:
    description: "Node.js 버전 (비우면 .nvmrc 사용)"
    required: false
    default: ""
  cache:
    description: "캐시 사용 여부 ('true' | 'false') — 최적화 전후 비교 측정용"
    required: false
    default: "true"

outputs:
  cache-hit:
    description: "node_modules 캐시 적중 여부"
    value: ${{ steps.nm-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}
        # 1단계 캐시: ~/.npm (tarball 저장소). 키 = OS + lockfile 해시 (RFC #15)
        cache: ${{ inputs.cache == 'true' && 'npm' || '' }}

    # 2단계 캐시: node_modules 자체. 적중하면 npm ci를 통째로 건너뛴다.
    # esbuild/rollup 등 플랫폼별 바이너리가 있어 OS·Node 버전을 키에 포함한다 (ADR-0005).
    - name: Cache node_modules
      id: nm-cache
      if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: node_modules
        key: nm-${{ runner.os }}-${{ runner.arch }}-node${{ inputs.node-version || 'nvmrc' }}-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: steps.nm-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --prefer-offline --no-audit --no-fund

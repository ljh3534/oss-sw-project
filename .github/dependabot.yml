# 설치 단계에서 뺀 npm audit(ADR-0005)을 대체: 취약·구버전 의존성과 액션을 주 1회 점검해 PR로 올린다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      dev-dependencies:
        dependency-type: development
        # 메이저 업데이트는 호환성 검토가 필요하므로 그룹에서 빼고 개별 PR로 받는다
        update-types: [minor, patch]
    ignore:
      # typescript-eslint가 TypeScript <6.1만 지원 — 지원되면 해제
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    commit-message:
      prefix: ci

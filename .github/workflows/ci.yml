# 8주차: 최적화된 CI/CD (RFC #15 → ADR-0005)
#
#  changes ─┬─> (코드 변경 시) ci  ── reusable-node-ci.yml (Composite Action + 캐시)
#  plan  ───┘                    └─> deploy (main push + 코드 변경 시에만)
#  ci-result: 모든 결과를 집계하는 단일 required check
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      cache:
        description: "의존성 캐시 사용 (끄면 최적화 전 측정용)"
        type: boolean
        default: true
      full-matrix:
        description: "전체 매트릭스 실행"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - '*.config.*'
              - 'tsconfig.json'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
              - '.github/workflows/reusable-node-ci.yml'
              - '.github/actions/**'
            docs:
              - '**/*.md'
              - 'docs/**'

  plan:
    name: Plan test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          FULL: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full-matrix) }}
        run: |
          if [ "$FULL" = "true" ]; then
            # main: 3 OS × 3 Node = 9  + include 확장(Node 26 실험)  - exclude(macOS × Node 20, EOL)
            MATRIX='{"os":["ubuntu-latest","windows-latest","macos-latest"],"node":[20,22,24],
                     "exclude":[{"os":"macos-latest","node":20}],
                     "include":[{"os":"ubuntu-latest","node":26,"experimental":true}]}'
          else
            # PR: ubuntu × 20/22/24 + windows/macOS × 22 = 5 (OS 차이는 잡되 비용은 절반)
            MATRIX='{"include":[{"os":"ubuntu-latest","node":20},{"os":"ubuntu-latest","node":22},
                     {"os":"ubuntu-latest","node":24},{"os":"windows-latest","node":22},
                     {"os":"macos-latest","node":22}]}'
          fi
          echo "matrix=$(echo "$MATRIX" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "### Test matrix ($([ "$FULL" = "true" ] && echo full || echo reduced))" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"; echo "$MATRIX" | jq . >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: Node CI
    needs: [changes, plan]
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-node-ci.yml
    with:
      test-matrix: ${{ needs.plan.outputs.matrix }}
      cache: ${{ github.event_name != 'workflow_dispatch' || inputs.cache }}
    secrets:
      BUILD_SIGNING_KEY: ${{ secrets.BUILD_SIGNING_KEY }}

  deploy:
    name: Deploy to GitHub Pages
    needs: [changes, ci]
    # 선택적 배포: main 브랜치 push + 실제 코드 변경이 있을 때만
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v4

  ci-result:
    name: CI result
    needs: [changes, ci, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CI: ${{ needs.ci.result }}
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          echo "code changed: $CODE / ci: $CI / deploy: $DEPLOY" | tee -a "$GITHUB_STEP_SUMMARY"
          for r in "$CI" "$DEPLOY"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then exit 1; fi
          done
          [ "$CODE" = "true" ] || echo "문서만 변경 → build/test/deploy 생략 (정상)" >> "$GITHUB_STEP_SUMMARY"

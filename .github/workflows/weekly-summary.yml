# 5주차: 비동기 협업 — 주간 요약
# 매주 월요일 09:00(KST)에 지난 7일간의 활동을 요약한 이슈를 만든다. 주간 회의를 대체하는 비동기 리포트.
name: Weekly Summary

on:
  schedule:
    - cron: "0 0 * * 1" # 월요일 00:00 UTC = 09:00 KST
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const since = new Date(Date.now() - 7 * 864e5);
            const sinceISO = since.toISOString();
            const day = (d) => d.toISOString().slice(0, 10);

            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "all", since: sinceISO, per_page: 100 });
            const onlyIssues = issues.filter((i) => !i.pull_request);
            const opened = onlyIssues.filter((i) => new Date(i.created_at) >= since);
            const closed = onlyIssues.filter((i) => i.closed_at && new Date(i.closed_at) >= since);

            // 최근 수정 순으로 받다가 기간 밖 페이지가 나오면 중단 (API 호출 최소화)
            const prs = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: "closed", sort: "updated", direction: "desc", per_page: 100 },
              (res, done) => {
                if (res.data.some((p) => new Date(p.updated_at) < since)) done();
                return res.data;
              },
            );
            const merged = prs.filter((p) => p.merged_at && new Date(p.merged_at) >= since);
            const leadHours = merged.map((p) => (new Date(p.merged_at) - new Date(p.created_at)) / 36e5).sort((a, b) => a - b);
            const median = leadHours.length ? leadHours[Math.floor(leadHours.length / 2)].toFixed(1) : "-";

            const openNow = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", per_page: 100 });
            const slaBreached = openNow.filter((i) => i.labels.some((l) => l.name === "sla-breached"));

            const commits = await github.paginate(github.rest.repos.listCommits, { owner, repo, since: sinceISO, per_page: 100 });

            const list = (arr, fmt) => (arr.length ? arr.map(fmt).join("\n") : "- 없음");
            const body = [
              `## 📊 주간 요약 (${day(since)} ~ ${day(new Date())})`,
              "",
              "| 지표 | 값 |",
              "|---|---|",
              `| main 커밋 | ${commits.length} |`,
              `| 병합된 PR | ${merged.length} |`,
              `| PR 리드타임 중앙값 | ${median}h |`,
              `| 새 이슈 / 닫힌 이슈 | ${opened.length} / ${closed.length} |`,
              `| 현재 열린 이슈·PR | ${openNow.length} |`,
              `| SLA 위반 중 | ${slaBreached.length} |`,
              "",
              "### ✅ 병합된 PR",
              list(merged, (p) => `- #${p.number} ${p.title} (@${p.user.login})`),
              "",
              "### 🆕 새 이슈",
              list(opened, (i) => `- #${i.number} ${i.title}`),
              "",
              "### ⏰ SLA 위반",
              list(slaBreached, (i) => `- #${i.number} ${i.title}`),
              "",
              "> 이 이슈는 `weekly-summary.yml` 워크플로가 자동 생성했습니다. 논의할 내용은 댓글로 남겨 주세요.",
            ].join("\n");

            const { data } = await github.rest.issues.create({
              owner, repo,
              title: `[주간 요약] ${day(new Date())}`,
              body,
              labels: ["weekly-summary"],
            });
            core.info(`created ${data.html_url}`);

# 5주차: 비동기 협업 — 자동 응답
# 새 이슈·PR·Discussion이 생기면 즉시 안내 댓글을 달고 분류 라벨을 붙인다.
# 사람이 24시간 안에 답하지 못해도 작성자는 "접수됐다"는 것과 다음 단계를 바로 안다.
name: Auto Response

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
  discussion:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  discussions: write

jobs:
  respond:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const name = context.eventName;
            const guide = `https://github.com/${owner}/${repo}/blob/main`;

            if (name === "issues") {
              const issue = context.payload.issue;
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ["needs-triage"] });
              // 메인테이너가 작업 추적용으로 만든 이슈에는 안내 댓글을 생략 (노이즈 방지)
              if (["OWNER", "MEMBER", "COLLABORATOR"].includes(issue.author_association)) return;
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: [
                  `안녕하세요 @${issue.user.login}님, 이슈를 남겨 주셔서 감사합니다! 🙌`,
                  "",
                  "- 메인테이너가 **24시간 이내**에 첫 응답을 드리는 것을 목표로 합니다 (SLA).",
                  "- 재현 방법·입력값이 빠져 있다면 추가해 주시면 처리가 빨라집니다.",
                  `- 직접 고쳐 보고 싶다면 [기여 가이드](${guide}/CONTRIBUTING.md)를 참고해 주세요.`,
                ].join("\n"),
              });
            }

            if (name === "pull_request_target") {
              const pr = context.payload.pull_request;
              // 저장소 소유자/협업자가 아닌 첫 기여자에게만 환영 메시지
              if (["FIRST_TIME_CONTRIBUTOR", "FIRST_TIMER", "NONE"].includes(pr.author_association)) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pr.number,
                  body: [
                    `@${pr.user.login}님, 첫 PR을 환영합니다! 🎉`,
                    "",
                    `- 리뷰는 [리뷰 가이드](${guide}/docs/REVIEW_GUIDE.md)의 \`[MUST]\`/\`[SHOULD]\` 태그 규칙으로 진행됩니다.`,
                    "- CI(Lint·Test·Build)가 통과해야 병합할 수 있습니다.",
                  ].join("\n"),
                });
              }
            }

            if (name === "discussion") {
              const d = context.payload.discussion;
              const body = d.category.name === "Q&A"
                ? `@${d.user.login}님, 질문 감사합니다! 답변이 해결되면 해당 댓글을 **Mark as answer**로 표시해 주세요. 먼저 [Wiki – Troubleshooting](https://github.com/${owner}/${repo}/wiki/Troubleshooting)도 확인해 보세요.`
                : `@${d.user.login}님, 의견 감사합니다! RFC라면 [ADR 절차](${guide}/docs/adr/README.md)에 따라 합의 후 ADR로 기록됩니다.`;
              await github.graphql(
                `mutation($id: ID!, $body: String!) { addDiscussionComment(input: {discussionId: $id, body: $body}) { comment { id } } }`,
                { id: d.node_id, body },
              );
            }
